name: Deploy to Production

on:
  push:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/aurelth/financeflow/financeflow-api
  IMAGE_WORKERS: ghcr.io/aurelth/financeflow/financeflow-workers

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build e push imagem da API
        uses: docker/build-push-action@v5
        with:
          context: ./backend/FinanceFlow
          file: ./backend/FinanceFlow/Dockerfile.API
          push: true
          tags: ${{ env.IMAGE_API }}:latest

      - name: Build e push imagem do Workers
        uses: docker/build-push-action@v5
        with:
          context: ./backend/FinanceFlow
          file: ./backend/FinanceFlow/Dockerfile.Workers
          push: true
          tags: ${{ env.IMAGE_WORKERS }}:latest

      - name: Deploy no VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u aurelth --password-stdin
            cd /home/deploy/financeflow
            docker compose pull api workers
            docker compose up -d api workers
            docker image prune -f